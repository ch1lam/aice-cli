name: release

on:
  push:
    tags:
      - "v*"
  # Manual trigger for a dry run: builds and bundles every target without
  # creating a release. Only actual tag pushes publish to GitHub Releases.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      # Chocolatey-installed binaries do not land on PATH for later steps, so
      # download the release zip directly. The version and SHA-256 mirror the
      # pin in internal/deps/versions.go.
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "15.2.0"
          $sha256 = "71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5"
          $asset = "ripgrep-$version-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$version/$asset" -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() -ne $sha256) {
            throw "ripgrep download checksum mismatch"
          }
          $dest = Join-Path $env:RUNNER_TEMP "ripgrep-$version"
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content $env:GITHUB_PATH (Join-Path $dest "ripgrep-$version-x86_64-pc-windows-msvc")

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and bundle
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}" # "v0.1.0" -> "0.1.0"; on a manual run this is a branch name
          mkdir -p dist staging
          binary="aice"
          extension="tar.gz"
          if [ "${GOOS}" = "windows" ]; then
            binary="aice.exe"
            extension="zip"
          fi
          # Stable, version-free names so releases/latest/download/... keeps
          # resolving to the newest build; the version is embedded in the binary.
          # LICENSE and README ride along so a redistributed copy keeps its
          # license; go-selfupdate's `aice update` locates the executable inside
          # the archive by name and ignores the extra files.
          bundle="aice_${GOOS}_${GOARCH}.${extension}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/ch1lam/aice-cli/internal/cli.Version=${version}" \
            -o "staging/${binary}" ./cmd/aice
          cp LICENSE README.md staging/
          if [ "${GOOS}" = "windows" ]; then
            (cd staging && zip -q -r "../dist/${bundle}" "${binary}" LICENSE README.md)
          else
            tar -czf "dist/${bundle}" -C staging "${binary}" LICENSE README.md
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
