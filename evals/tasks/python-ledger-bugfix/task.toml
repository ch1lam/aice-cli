schema_version = "1.4"
# Each step keeps the workspace it leaves, for review of its diff.
artifacts = ["/app"]

[task]
name = "aice/python-ledger-bugfix"
description = "Find and repair a precision defect in a Python CSV ledger CLI."
keywords = ["python", "cli", "maintenance", "bug-fix"]

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = true
